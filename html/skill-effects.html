<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base href="../">
<title>Skill Effect Frame Atlas - Click to Commit</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { min-height:100%; }
body {
  background:#060b14;
  color:#c8d0e0;
  font-family:'Courier New', monospace;
  padding:32px;
}
h1 {
  font-size:14px;
  letter-spacing:3px;
  color:#5BE8FF;
  text-transform:uppercase;
  margin-bottom:8px;
}
.subtitle {
  font-size:11px;
  color:#3a4a5a;
  margin-bottom:34px;
}
.skill-group { margin-bottom:38px; }
.skill-label {
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:14px;
  border-bottom:1px solid #0e1a28;
  padding-bottom:8px;
}
.parts-row {
  display:flex;
  flex-direction:column;
  gap:12px;
}
.part-strip {
  display:flex;
  align-items:center;
  gap:12px;
}
.part-name {
  width:190px;
  font-size:9px;
  line-height:1.3;
  letter-spacing:1px;
  color:#506070;
}
.frame-strip {
  display:flex;
  gap:2px;
  padding:6px;
  background:#070d18;
  border:1px solid #0e1a28;
}
.sprite {
  width:64px;
  height:64px;
  position:relative;
  overflow:hidden;
  flex:none;
  color:var(--col);
  --col:#5BE8FF;
  --glow:rgba(91,232,255,.7);
  --bg:rgba(6,11,20,.92);
}
.glyph {
  position:absolute;
  inset:0;
  width:64px;
  height:64px;
  overflow:visible;
  shape-rendering:crispEdges;
  filter:drop-shadow(0 0 5px var(--glow));
}
.line {
  fill:none;
  stroke:var(--col);
  stroke-width:2;
  stroke-linecap:square;
  stroke-linejoin:miter;
  vector-effect:non-scaling-stroke;
}
.line.thin { stroke-width:1; opacity:.72; }
.line.dot { stroke-dasharray:2 5; stroke-linecap:round; }
.fill-main {
  fill:var(--bg);
  stroke:var(--col);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
}
.fill-soft {
  fill:rgba(91,232,255,.12);
  stroke:var(--col);
  stroke-width:1;
}
.dim { opacity:.28; }
.faint { opacity:.14; }
.hot-stroke { stroke:#EF4444; }
.hot-fill { fill:rgba(239,68,68,.18); stroke:#EF4444; }
.gold-stroke { stroke:#FBB03B; }
.gold-fill { fill:rgba(251,176,59,.16); stroke:#FBB03B; }
.white-stroke { stroke:#fff; }
.cyan-fill { fill:rgba(56,189,248,.12); stroke:#38BDF8; }

#export-grid { display:none; }
#export-grid.visible { display:block; }
.export-grid-inner {
  display:flex;
  flex-wrap:wrap;
  width:512px;
  gap:0;
  background:transparent;
}
.export-cell {
  width:64px;
  height:64px;
  overflow:hidden;
  background:transparent;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.controls {
  position:fixed;
  bottom:24px;
  right:24px;
  display:flex;
  gap:8px;
}
button {
  background:#0e1a28;
  color:#4a8aaa;
  border:1px solid #1a3a5a;
  padding:8px 14px;
  font-family:'Courier New', monospace;
  font-size:11px;
  letter-spacing:1px;
  cursor:pointer;
}
button:hover { background:#1a2a3a; color:#7ab8d8; }
.mode-indicator {
  position:fixed;
  bottom:24px;
  left:24px;
  font-size:10px;
  color:#2a4a6a;
  letter-spacing:2px;
}
</style>
</head>
<body>

<h1>Skill Effect Frame Atlas</h1>
<p class="subtitle">18 VFX parts x 8 frames. Unity-ready 64x64 grid atlas source.</p>

<div class="skill-group" id="group-chain">
  <div class="skill-label" style="color:#5BE8FF;">Method Chaining</div>
  <div class="parts-row" id="row-chain"></div>
</div>

<div class="skill-group" id="group-transaction">
  <div class="skill-label" style="color:#A78BFA;">Transaction</div>
  <div class="parts-row" id="row-transaction"></div>
</div>

<div class="skill-group" id="group-worker">
  <div class="skill-label" style="color:#F59E0B;">Worker Thread</div>
  <div class="parts-row" id="row-worker"></div>
</div>

<div class="skill-group" id="group-vdom">
  <div class="skill-label" style="color:#38BDF8;">Virtual DOM</div>
  <div class="parts-row" id="row-vdom"></div>
</div>

<div id="export-grid">
  <p style="font-size:10px;color:#2a4a6a;margin-bottom:8px;letter-spacing:2px;">
    EXPORT MODE - 18 rows x 8 frames = 512x1152, 64x64 per sprite
  </p>
  <div class="export-grid-inner" id="export-grid-inner"></div>
</div>

<div class="mode-indicator" id="mode-indicator">MODE: PREVIEW</div>
<div class="controls">
  <button onclick="toggleExport()">EXPORT VIEW</button>
</div>

<script>
const FRAME_COUNT = 8;

const PARTS = [
  { group:'chain', id:'chain_crackle',   name:'source charge pulse',      fps:14, loop:true,  col:'#5BE8FF', bg:'rgba(4,18,30,.92)', glow:'rgba(91,232,255,.8)' },
  { group:'chain', id:'chain_pipeline',  name:'base conductor beam',      fps:8,  loop:true,  col:'#5BE8FF', bg:'rgba(4,18,30,.92)', glow:'rgba(91,232,255,.8)' },
  { group:'chain', id:'chain_sparks',    name:'conductive discharge',     fps:14, loop:true,  col:'#5BE8FF', bg:'rgba(4,18,30,.92)', glow:'rgba(91,232,255,.8)' },
  { group:'chain', id:'chain_hit_burst', name:'arc arrival impact burst', fps:18, loop:false, col:'#5BE8FF', bg:'rgba(4,18,30,.92)', glow:'rgba(91,232,255,.8)' },

  { group:'transaction', id:'tx_scan_square', name:'rotating scan square', fps:12, loop:true, col:'#A78BFA', bg:'rgba(20,8,40,.92)', glow:'rgba(167,139,250,.78)' },
  { group:'transaction', id:'tx_dotted_edge', name:'lavender dotted edge', fps:12, loop:true, col:'#A78BFA', bg:'rgba(20,8,40,.92)', glow:'rgba(167,139,250,.78)' },

  { group:'worker', id:'worker_factory', name:'factory core', fps:8, loop:true, col:'#F59E0B', bg:'rgba(30,14,4,.94)', glow:'rgba(245,158,11,.78)' },
  { group:'worker', id:'worker_drone', name:'orange drone', fps:12, loop:true, col:'#F59E0B', bg:'rgba(30,14,4,.94)', glow:'rgba(245,158,11,.78)' },
  { group:'worker', id:'worker_lock_circle', name:'orange dotted lock circle', fps:12, loop:true, col:'#F59E0B', bg:'rgba(30,14,4,.94)', glow:'rgba(245,158,11,.78)' },
  { group:'worker', id:'worker_dotted_edge', name:'orange dotted drone path', fps:12, loop:true, col:'#F59E0B', bg:'rgba(30,14,4,.94)', glow:'rgba(245,158,11,.78)' },
  { group:'worker', id:'worker_drone_awaken', name:'red awaken drone', fps:14, loop:true, col:'#EF4444', bg:'rgba(34,8,10,.94)', glow:'rgba(239,68,68,.82)' },
  { group:'worker', id:'worker_lock_circle_awaken', name:'red awaken lock circle', fps:14, loop:true, col:'#EF4444', bg:'rgba(34,8,10,.94)', glow:'rgba(239,68,68,.82)' },
  { group:'worker', id:'worker_vtx_particle', name:'red VTX particle burst', fps:18, loop:false, col:'#EF4444', bg:'rgba(34,8,10,.94)', glow:'rgba(239,68,68,.82)' },

  { group:'vdom', id:'vdom_renderer', name:'renderer core', fps:8, loop:true, col:'#38BDF8', bg:'rgba(7,26,36,.94)', glow:'rgba(56,189,248,.82)' },
  { group:'vdom', id:'vdom_target_layout', name:'targeting layout', fps:10, loop:true, col:'#38BDF8', bg:'rgba(7,26,36,.94)', glow:'rgba(56,189,248,.82)' },
  { group:'vdom', id:'vdom_solid_edge', name:'cyan solid edge', fps:14, loop:true, col:'#38BDF8', bg:'rgba(7,26,36,.94)', glow:'rgba(56,189,248,.82)' },
  { group:'vdom', id:'vdom_dirty_awaken', name:'red dirty jitter', fps:16, loop:true, col:'#EF4444', bg:'rgba(34,8,10,.94)', glow:'rgba(239,68,68,.82)' },
  { group:'vdom', id:'vdom_patch_particle', name:'red patch particle burst', fps:18, loop:false, col:'#EF4444', bg:'rgba(34,8,10,.94)', glow:'rgba(239,68,68,.82)' },
];

function n(value, digits = 2) {
  return Number(value).toFixed(digits).replace(/\.?0+$/, '');
}

function applyVars(el, part) {
  el.style.setProperty('--col', part.col);
  el.style.setProperty('--bg', part.bg);
  el.style.setProperty('--glow', part.glow);
}

function svgWrap(content) {
  return `<svg class="glyph" viewBox="0 0 64 64" aria-hidden="true">${content}</svg>`;
}

function chainCrackle(f) {
  // Source charge pulse: symmetric ring + 4-way equal traces — loop
  // f0-1: building, f2: peak flash, f3-5: settle, f6: mini flash, f7: dim
  const bright = [0.50, 0.70, 1.00, 0.75, 0.55, 0.65, 0.90, 0.60][f];
  const flash  = f === 2 || f === 6;
  const w = flash ? 'white-stroke' : '';
  const cx = 32, cy = 32, hw = 4;
  // All 4 traces equal length (symmetric loop source)
  const tr = [8, 13, 20, 13, 9, 11, 18, 12][f];
  const dr = flash ? 2.5 : 1.6;
  // Outer ring radius (faint, breathes)
  const rr = [10, 13, 16, 13, 10, 12, 15, 11][f];
  const parts = [
    `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="rgba(91,232,255,${flash?0.35:0.15})" stroke-width="1"/>`,
    `<line class="line ${w}" style="stroke-width:2.5;stroke-linecap:square" x1="${cx}" y1="${cy-hw}" x2="${cx}" y2="${cy-hw-tr}"/>`,
    `<line class="line ${w}" style="stroke-width:2.5;stroke-linecap:square" x1="${cx+hw}" y1="${cy}" x2="${cx+hw+tr}" y2="${cy}"/>`,
    `<line class="line ${w}" style="stroke-width:2.5;stroke-linecap:square" x1="${cx}" y1="${cy+hw}" x2="${cx}" y2="${cy+hw+tr}"/>`,
    `<line class="line ${w}" style="stroke-width:2.5;stroke-linecap:square" x1="${cx-hw}" y1="${cy}" x2="${cx-hw-tr}" y2="${cy}"/>`,
    `<circle class="fill-soft" cx="${cx}" cy="${cy-hw-tr}" r="${dr}"/>`,
    `<circle class="fill-soft" cx="${cx+hw+tr}" cy="${cy}" r="${dr}"/>`,
    `<circle class="fill-soft" cx="${cx}" cy="${cy+hw+tr}" r="${dr}"/>`,
    `<circle class="fill-soft" cx="${cx-hw-tr}" cy="${cy}" r="${dr}"/>`,
    `<rect class="fill-main ${w}" x="${cx-hw}" y="${cy-hw}" width="${hw*2}" height="${hw*2}" rx="1"/>`,
  ];
  return svgWrap(`<g opacity="${bright}">${parts.join('')}</g>`);
}

function chainPipeline(f) {
  // BASE CONDUCTOR: horizontal glowing beam + binary digit floats
  const cy = 32;
  const bright = [0.72, 0.83, 1.00, 0.86, 0.72, 0.84, 0.98, 0.80][f];
  const flash = f === 2 || f === 6;
  const parts = [];
  parts.push(`<line x1="2" y1="${cy}" x2="62" y2="${cy}" stroke="rgba(91,232,255,${flash?0.30:0.12})" stroke-width="14" stroke-linecap="round"/>`);
  parts.push(`<line x1="2" y1="${cy}" x2="62" y2="${cy}" stroke="rgba(91,232,255,${flash?0.58:0.28})" stroke-width="5"  stroke-linecap="round"/>`);
  parts.push(`<line x1="2" y1="${cy}" x2="62" y2="${cy}" stroke="${flash?'rgba(220,248,255,0.96)':'rgba(91,232,255,0.88)'}" stroke-width="${flash?2.5:2}" stroke-linecap="square"/>`);
  [12,22,32,42,52].forEach(x => {
    const h = flash ? 5 : 3;
    parts.push(`<line x1="${x}" y1="${cy-h}" x2="${x}" y2="${cy+h}" stroke="rgba(91,232,255,${flash?0.70:0.38})" stroke-width="1.5"/>`);
  });
  const BITS = [
    [{x:8, y:23,v:'0'},{x:30,y:43,v:'1'},{x:52,y:22,v:'1'}],
    [{x:14,y:22,v:'1'},{x:38,y:44,v:'0'},{x:56,y:24,v:'0'}],
    [{x:6, y:21,v:'1'},{x:24,y:45,v:'1'},{x:44,y:21,v:'0'},{x:58,y:43,v:'1'}],
    [{x:10,y:24,v:'0'},{x:32,y:43,v:'1'},{x:54,y:23,v:'0'}],
    [{x:18,y:23,v:'0'},{x:36,y:44,v:'0'},{x:50,y:22,v:'1'}],
    [{x:12,y:22,v:'1'},{x:28,y:44,v:'1'},{x:48,y:24,v:'0'}],
    [{x:4, y:21,v:'0'},{x:20,y:45,v:'1'},{x:40,y:20,v:'1'},{x:58,y:43,v:'0'}],
    [{x:16,y:24,v:'1'},{x:34,y:43,v:'0'},{x:52,y:22,v:'1'}],
  ][f];
  BITS.forEach(b => parts.push(`<text x="${b.x}" y="${b.y}" style="font:5px Consolas;fill:rgba(91,232,255,0.38)">${b.v}</text>`));
  return svgWrap(`<g opacity="${bright}">${parts.join('')}</g>`);
}

function chainSparks(f) {
  // CONDUCTIVE DISCHARGE: wild branching lightning off the pipeline
  const cy = 32;
  const bright = [0.55, 0.78, 1.00, 0.80, 0.55, 0.78, 1.00, 0.72][f];
  const flash = f === 2 || f === 6;
  const s = [0.55, 0.75, 1.0, 0.82, 0.58, 0.78, 0.98, 0.70][f];
  const parts = [];
  // A/B bolt sets alternate each frame → visually different every frame
  const BA = {
    up: [[7, [[-1,-7],[2,-8],[-2,-7]]],[18,[[2,-9],[-1,-9],[3,-8],[-1,-6]]],[30,[[-2,-8],[3,-9],[-1,-8]]],[44,[[1,-9],[-2,-8],[2,-7],[-1,-6]]],[56,[[-2,-8],[1,-7]]]],
    dn: [[12,[[2,7],[-1,8],[1,6]]],[26,[[-2,8],[3,7],[-1,8]]],[40,[[1,7],[-2,8],[2,6]]],[54,[[-1,7],[2,6]]]],
  };
  const BB = {
    up: [[10,[[2,-8],[-1,-8],[1,-6]]],[22,[[-2,-9],[2,-8],[-2,-7],[1,-5]]],[34,[[3,-9],[-2,-8],[1,-7]]],[48,[[-1,-9],[2,-8],[-3,-7]]],[60,[[1,-7],[-2,-6]]]],
    dn: [[14,[[-1,8],[2,7],[-1,6]]],[28,[[2,9],[-2,7],[1,8]]],[42,[[-2,7],[1,8],[-1,6]]],[58,[[2,7],[-1,6]]]],
  };
  const bl = (f % 2 === 0) ? BA : BB;
  const upN = [3,4,5,4,3,4,5,4][f];
  const dnN = [2,3,4,3,2,3,4,3][f];
  const mkPath = (sx, segs) => {
    let px = sx, py = cy, d = `M${px} ${py}`;
    for (const [dx, dy] of segs) { px += dx; py += dy * s; d += ` L${n(px)} ${n(py)}`; }
    return d;
  };
  bl.up.slice(0,upN).forEach(([sx,segs]) => parts.push(`<path d="${mkPath(sx,segs)}" fill="none" stroke="rgba(91,232,255,${flash?0.88:0.64})" stroke-width="${flash?1.5:1}" stroke-linecap="round" stroke-linejoin="round"/>`));
  bl.dn.slice(0,dnN).forEach(([sx,segs]) => parts.push(`<path d="${mkPath(sx,segs)}" fill="none" stroke="rgba(91,232,255,${flash?0.55:0.38})" stroke-width="${flash?1.2:0.8}" stroke-linecap="round" stroke-linejoin="round"/>`));
  if (flash) {
    bl.up.slice(1,4).forEach(([sx,segs]) => {
      let mx = sx, my = cy;
      const h = Math.floor(segs.length / 2);
      for (let i = 0; i < h; i++) { mx += segs[i][0]; my += segs[i][1] * s; }
      parts.push(`<path d="M${n(mx)} ${n(my)} L${n(mx+6)} ${n(my-8*s)}" fill="none" stroke="rgba(91,232,255,0.42)" stroke-width="0.7" stroke-linecap="round"/>`);
    });
  }
  parts.push(`<line x1="2" y1="${cy}" x2="62" y2="${cy}" stroke="rgba(91,232,255,${flash?0.18:0.08})" stroke-width="1"/>`);
  return svgWrap(`<g opacity="${bright}">${parts.join('')}</g>`);
}

function chainHitBurst(f) {
  // ARC ARRIVAL IMPACT: centered one-shot burst at hit node — diagonal sparks + shrinking rect
  const bright = [0.50, 1.0, 0.85, 0.62, 0.38, 0.20, 0.09, 0.03][f];
  const cx = 32, cy = 32;
  const flash = f <= 1;
  const w = flash ? 'white-stroke' : '';
  const parts = [];
  const d45 = [0, 14, 11, 8, 6, 4, 2, 0][f];
  if (d45 > 0) {
    const sw = flash ? 2 : 1.5;
    const o = 4;
    parts.push(`<line class="line ${w}" style="stroke-width:${sw};stroke-linecap:round" x1="${cx+o}" y1="${cy-o}" x2="${cx+o+d45}" y2="${cy-o-d45}"/>`);
    parts.push(`<line class="line ${w}" style="stroke-width:${sw};stroke-linecap:round" x1="${cx-o}" y1="${cy-o}" x2="${cx-o-d45}" y2="${cy-o-d45}"/>`);
    parts.push(`<line class="line thin" x1="${cx+o}" y1="${cy+o}" x2="${cx+o+d45}" y2="${cy+o+d45}"/>`);
    parts.push(`<line class="line thin" x1="${cx-o}" y1="${cy+o}" x2="${cx-o-d45}" y2="${cy+o+d45}"/>`);
  }
  const hw = [12, 8, 6, 4, 2, 0, 0, 0][f];
  const rectOp = [0.25, 0.65, 0.40, 0.20, 0.08, 0, 0, 0][f];
  if (hw > 0)
    parts.push(`<rect x="${cx-hw}" y="${cy-hw}" width="${hw*2}" height="${hw*2}" fill="none" stroke="rgba(91,232,255,${rectOp})" stroke-width="1.5" rx="1"/>`);
  const coreR = [3, 6, 4, 3, 2, 1, 0, 0][f];
  if (coreR > 0) {
    if (flash) parts.push(`<circle class="fill-soft" cx="${cx}" cy="${cy}" r="${coreR+4}" opacity="0.40"/>`);
    parts.push(`<circle class="fill-main ${w}" cx="${cx}" cy="${cy}" r="${coreR}"/>`);
  }
  return svgWrap(`<g opacity="${bright}">${parts.join('')}</g>`);
}

function txScanSquare(f) {
  const angle = f * 45;
  const pulse = 1 + Math.sin((f / FRAME_COUNT) * Math.PI * 2) * .08;
  return svgWrap(`
    <g transform="translate(32 32) scale(${n(pulse)}) rotate(${angle}) translate(-32 -32)">
      <path class="line" d="M16 16 H27 M16 16 V27 M48 16 H37 M48 16 V27 M48 48 H37 M48 48 V37 M16 48 H27 M16 48 V37"/>
      <path class="line thin" d="M32 13 V22 M32 42 V51 M13 32 H22 M42 32 H51"/>
    </g>
    <rect class="fill-main" x="26" y="26" width="12" height="12" rx="3"/>
    <rect class="fill-soft dim" x="22" y="22" width="20" height="20"/>
  `);
}

function dottedEdge(col, f, red = false) {
  const offset = -f * 3;
  const stroke = red ? 'hot-stroke' : '';
  return svgWrap(`
    <path class="line dot ${stroke}" stroke-dashoffset="${offset}" d="M6 45 C19 20, 34 48, 58 17"/>
    <path class="line thin dim ${stroke}" stroke-dashoffset="${offset - 2}" d="M8 49 C20 26, 35 54, 57 23"/>
    <circle class="fill-main" cx="7" cy="45" r="4"/>
    <circle class="fill-main" cx="58" cy="17" r="4"/>
  `);
}

function workerFactory(f) {
  const angle = f * 45;
  const blink = f % 2 ? 1 : .35;
  return svgWrap(`
    <circle class="line thin dim" cx="32" cy="32" r="25"/>
    <rect class="fill-main" x="17" y="20" width="30" height="28"/>
    <path class="line thin" d="M22 26 H42 M22 34 H42 M28 20 V48 M36 20 V48"/>
    <g transform="rotate(${angle} 32 34)">
      <path class="line gold-stroke thin" d="M32 24 V44 M22 34 H42 M25 27 L39 41 M39 27 L25 41"/>
    </g>
    <rect class="gold-fill" x="22" y="12" width="8" height="8"/>
    <rect class="gold-fill" x="34" y="12" width="8" height="8"/>
    <circle class="gold-fill" cx="44" cy="23" r="3" opacity="${blink}"/>
  `);
}

function workerDrone(f, red = false) {
  const bob = Math.sin((f / FRAME_COUNT) * Math.PI * 2);
  const x = bob * 3;
  const y = -Math.abs(bob) * 4;
  const angle = red ? (f % 2 ? -8 : 8) : bob * 8;
  const innerClass = red ? 'hot-fill' : 'gold-fill';
  const cross = red ? '<path class="line thin white-stroke" d="M24 24 L40 40 M40 24 L24 40"/>' : '';
  return svgWrap(`
    <g transform="translate(${n(x)} ${n(y)}) rotate(${n(angle)} 32 32)">
      <polygon class="fill-main" points="32,${red ? 11 : 13} ${red ? 51 : 49},32 32,${red ? 53 : 51} ${red ? 13 : 15},32"/>
      <polygon class="${innerClass}" points="32,22 42,32 32,42 22,32"/>
      ${cross}
      <path class="line thin ${red ? 'hot-stroke' : ''}" d="M32 5 V15 M32 49 V59 M5 32 H15 M49 32 H59"/>
    </g>
  `);
}

function workerLockCircle(f, red = false) {
  const angle = f * 22.5;
  const r = 21 + Math.sin((f / FRAME_COUNT) * Math.PI * 2) * 2;
  const stroke = red ? 'hot-stroke' : '';
  const center = red ? '<path class="line thin white-stroke" d="M20 20 L44 44 M44 20 L20 44"/><circle class="hot-fill" cx="32" cy="32" r="5"/>' : '<circle class="fill-soft" cx="32" cy="32" r="4"/>';
  return svgWrap(`
    <g transform="rotate(${angle} 32 32)">
      <circle class="line dot ${stroke}" cx="32" cy="32" r="${n(r)}"/>
      <circle class="line thin dim ${stroke}" cx="32" cy="32" r="${n(r - 8)}"/>
    </g>
    <path class="line thin ${stroke}" d="M32 7 V15 M32 49 V57 M7 32 H15 M49 32 H57"/>
    ${center}
  `);
}

function workerDottedEdge(f) {
  const offset = -f * 4;
  const px = 8 + (48 * f / (FRAME_COUNT - 1));
  const py = 48 - (32 * f / (FRAME_COUNT - 1));
  return svgWrap(`
    <path class="line dot" stroke-dashoffset="${offset}" d="M8 48 L56 16"/>
    <path class="line thin dim" stroke-dashoffset="${offset - 2}" d="M10 54 L58 22"/>
    <polygon class="fill-main" points="8,43 13,48 8,53 3,48"/>
    <polygon class="fill-main" points="56,11 61,16 56,21 51,16"/>
    <circle class="gold-fill" cx="${n(px)}" cy="${n(py)}" r="3"/>
  `);
}

function workerVtxParticle(f) {
  const t = f / (FRAME_COUNT - 1);
  const scale = .45 + Math.sin(t * Math.PI) * 1.05;
  const alpha = 1 - Math.max(0, t - .55) * 1.6;
  const d = 8 + t * 18;
  return svgWrap(`
    <g transform="translate(32 32) scale(${n(scale)}) translate(-32 -32)" opacity="${n(alpha)}">
      <rect class="hot-fill" x="30" y="${n(20 - d)}" width="4" height="15"/>
      <rect class="hot-fill" x="30" y="${n(29 + d)}" width="4" height="15"/>
      <rect class="hot-fill" x="${n(20 - d)}" y="30" width="15" height="4"/>
      <rect class="hot-fill" x="${n(29 + d)}" y="30" width="15" height="4"/>
      <path class="line hot-stroke" d="M18 18 L${n(18 - d)} ${n(18 - d)} M46 18 L${n(46 + d)} ${n(18 - d)} M18 46 L${n(18 - d)} ${n(46 + d)} M46 46 L${n(46 + d)} ${n(46 + d)}"/>
      <rect class="fill-main" x="28" y="28" width="8" height="8"/>
    </g>
  `);
}

function vdomRenderer(f) {
  const pulse = .55 + Math.sin((f / FRAME_COUNT) * Math.PI * 2) * .35;
  const scanY = 18 + f * 4;
  return svgWrap(`
    <rect class="fill-main" x="17" y="17" width="30" height="30"/>
    <path class="line thin" d="M22 17 V47 M28 17 V47 M36 17 V47 M42 17 V47 M17 22 H47 M17 28 H47 M17 36 H47 M17 42 H47"/>
    <rect class="cyan-fill" x="26" y="26" width="12" height="12" opacity="${n(pulse)}"/>
    <path class="line white-stroke thin" d="M17 ${scanY} H47"/>
    <circle class="line thin dim" cx="32" cy="32" r="${n(22 + pulse * 4)}"/>
  `);
}

function vdomTargetLayout(f) {
  const pulse = 1 + Math.sin((f / FRAME_COUNT) * Math.PI * 2) * .05;
  const y = 18 + f * 3.5;
  return svgWrap(`
    <g transform="translate(32 32) scale(${n(pulse)}) translate(-32 -32)">
      <rect class="cyan-fill" x="15" y="14" width="34" height="34"/>
      <path class="line thin" d="M15 14 H27 M15 14 V26 M49 14 H37 M49 14 V26 M49 48 H37 M49 48 V36 M15 48 H27 M15 48 V36"/>
      <path class="line thin dim" d="M23 14 V48 M32 14 V48 M41 14 V48 M15 23 H49 M15 32 H49 M15 41 H49"/>
      <path class="line white-stroke thin" d="M15 ${n(y)} H49"/>
    </g>
  `);
}

function vdomSolidEdge(f) {
  const x = 8 + (48 * f / (FRAME_COUNT - 1));
  const y = 48 - (32 * f / (FRAME_COUNT - 1));
  const opacity = .35 + .65 * Math.sin(((f + 1) / FRAME_COUNT) * Math.PI);
  return svgWrap(`
    <path class="line" d="M8 48 L56 16"/>
    <path class="line thin white-stroke" opacity="${n(opacity)}" d="M12 52 L60 20"/>
    <circle class="fill-main" cx="8" cy="48" r="4"/>
    <rect class="fill-main" x="52" y="12" width="8" height="8"/>
    <circle class="cyan-fill" cx="${n(x)}" cy="${n(y)}" r="3"/>
  `);
}

function vdomDirtyAwaken(f) {
  const jitter = [[0,0],[-2,1],[2,-1],[-1,-2],[2,2],[-2,0],[1,-1],[0,2]][f];
  const skew = [0,-3,2,-1,3,-2,1,0][f];
  return svgWrap(`
    <g transform="translate(${jitter[0]} ${jitter[1]}) skewX(${skew})">
      <rect class="hot-fill dim" x="18" y="15" width="31" height="31"/>
      <rect class="hot-fill" x="15" y="18" width="31" height="31"/>
      <path class="line thin hot-stroke" d="M21 18 V49 M28 18 V49 M35 18 V49 M42 18 V49 M15 24 H46 M15 31 H46 M15 38 H46 M15 45 H46"/>
      <path class="line thin white-stroke" d="M18 21 L43 46 M43 21 L18 46"/>
    </g>
  `);
}

function vdomPatchParticle(f) {
  const t = f / (FRAME_COUNT - 1);
  const scale = .4 + Math.sin(t * Math.PI) * 1.1;
  const alpha = 1 - Math.max(0, t - .6) * 1.7;
  const d = 9 + t * 20;
  return svgWrap(`
    <g transform="translate(32 32) scale(${n(scale)}) translate(-32 -32)" opacity="${n(alpha)}">
      <rect class="hot-fill" x="30" y="${n(18 - d)}" width="5" height="16"/>
      <rect class="hot-fill" x="30" y="${n(30 + d)}" width="5" height="16"/>
      <rect class="gold-fill" x="${n(16 - d)}" y="${n(18 - d / 2)}" width="4" height="13" transform="rotate(-45 10 22)"/>
      <rect class="hot-fill" x="${n(48 + d / 2)}" y="${n(31 + d / 2)}" width="4" height="15" transform="rotate(45 54 42)"/>
      <path class="line hot-stroke" d="M13 32 H${n(4 - d)} M51 32 H${n(60 + d)} M20 20 L${n(12 - d)} ${n(12 - d)} M44 20 L${n(53 + d)} ${n(11 - d)} M20 44 L${n(11 - d)} ${n(53 + d)} M44 44 L${n(53 + d)} ${n(53 + d)}"/>
      <rect class="fill-main" x="27" y="27" width="10" height="10"/>
    </g>
  `);
}

function renderPart(part, frame) {
  switch (part.id) {
    case 'chain_crackle':   return chainCrackle(frame);
    case 'chain_pipeline':  return chainPipeline(frame);
    case 'chain_sparks':    return chainSparks(frame);
    case 'chain_hit_burst': return chainHitBurst(frame);
    case 'tx_scan_square': return txScanSquare(frame);
    case 'tx_dotted_edge': return dottedEdge(part.col, frame);
    case 'worker_factory': return workerFactory(frame);
    case 'worker_drone': return workerDrone(frame, false);
    case 'worker_lock_circle': return workerLockCircle(frame, false);
    case 'worker_dotted_edge': return workerDottedEdge(frame);
    case 'worker_drone_awaken': return workerDrone(frame, true);
    case 'worker_lock_circle_awaken': return workerLockCircle(frame, true);
    case 'worker_vtx_particle': return workerVtxParticle(frame);
    case 'vdom_renderer': return vdomRenderer(frame);
    case 'vdom_target_layout': return vdomTargetLayout(frame);
    case 'vdom_solid_edge': return vdomSolidEdge(frame);
    case 'vdom_dirty_awaken': return vdomDirtyAwaken(frame);
    case 'vdom_patch_particle': return vdomPatchParticle(frame);
    default: return svgWrap('');
  }
}

function buildSprite(part, frame) {
  const sprite = document.createElement('div');
  sprite.className = `sprite part-${part.id}`;
  sprite.dataset.partId = part.id;
  sprite.dataset.frame = frame;
  applyVars(sprite, part);
  sprite.innerHTML = renderPart(part, frame);
  return sprite;
}

function buildPreviewRows() {
  const rows = {
    chain: document.getElementById('row-chain'),
    transaction: document.getElementById('row-transaction'),
    worker: document.getElementById('row-worker'),
    vdom: document.getElementById('row-vdom'),
  };

  PARTS.forEach(part => {
    const strip = document.createElement('div');
    strip.className = 'part-strip';

    const name = document.createElement('div');
    name.className = 'part-name';
    name.style.color = part.col;
    name.textContent = `${part.id} | ${part.fps}fps | ${part.loop ? 'loop' : 'one-shot'}`;

    const frames = document.createElement('div');
    frames.className = 'frame-strip';
    for (let i = 0; i < FRAME_COUNT; i++) frames.appendChild(buildSprite(part, i));

    strip.appendChild(name);
    strip.appendChild(frames);
    rows[part.group].appendChild(strip);
  });
}

function buildExportGrid() {
  const grid = document.getElementById('export-grid-inner');
  grid.innerHTML = '';
  PARTS.forEach(part => {
    for (let frame = 0; frame < FRAME_COUNT; frame++) {
      const cell = document.createElement('div');
      cell.className = 'export-cell';
      cell.dataset.partId = part.id;
      cell.dataset.frame = String(frame);
      applyVars(cell, part);
      cell.appendChild(buildSprite(part, frame));
      grid.appendChild(cell);
    }
  });
}

buildPreviewRows();
buildExportGrid();

function toggleExport() {
  const groups = document.querySelectorAll('.skill-group');
  const exportGrid = document.getElementById('export-grid');
  const indicator = document.getElementById('mode-indicator');
  if (exportGrid.classList.contains('visible')) {
    exportGrid.classList.remove('visible');
    groups.forEach(el => { el.style.display = ''; });
    indicator.textContent = 'MODE: PREVIEW';
  } else {
    exportGrid.classList.add('visible');
    groups.forEach(el => { el.style.display = 'none'; });
    indicator.textContent = 'MODE: EXPORT - 18 rows x 8 frames';
  }
}
</script>
</body>
</html>
